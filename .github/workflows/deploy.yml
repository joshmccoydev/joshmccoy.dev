name: Deploy

# Publishes the static site when main moves. It does not run on pull
# requests. It also does nothing until CF_WORKER_NAME is set to the
# existing Worker, so a merge cannot create a second Worker by accident.
# Required secrets, set in GitHub and never in the repo:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# This workflow does not change DNS, custom domains, or Cloudflare Access.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: ${{ vars.CF_WORKER_NAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the public directory
        run: node scripts/sync-public.mjs --apply --dest dist
      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ${{ vars.CF_WORKER_NAME }}
